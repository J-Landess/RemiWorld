<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#4A0020"/>
  <!-- Cat head (round) -->
  <circle cx="32" cy="32" r="20" fill="#F9FAFB"/>
  <!-- Pointy ears -->
  <polygon points="14,18 20,6 26,18" fill="#F9FAFB"/>
  <polygon points="38,18 44,6 50,18" fill="#F9FAFB"/>
  <polygon points="16,18 20,9 25,18" fill="#FBCFE8"/>
  <polygon points="39,18 44,9 49,18" fill="#FBCFE8"/>
  <!-- Eyes (X marks like Hello Kitty) -->
  <line x1="22" y1="28" x2="28" y2="34" stroke="#1C1917" stroke-width="2.5"/>
  <line x1="28" y1="28" x2="22" y2="34" stroke="#1C1917" stroke-width="2.5"/>
  <line x1="36" y1="28" x2="42" y2="34" stroke="#1C1917" stroke-width="2.5"/>
  <line x1="42" y1="28" x2="36" y2="34" stroke="#1C1917" stroke-width="2.5"/>
  <!-- No mouth (like Hello Kitty) -->
  <!-- Bow (red) -->
  <path d="M38 14 Q42 10 46 14 Q42 18 38 14" fill="#EC4899"/>
  <path d="M46 14 Q50 10 54 14 Q50 18 46 14" fill="#EC4899"/>
  <circle cx="46" cy="14" r="3" fill="#BE185D"/>
  <!-- Whiskers -->
  <line x1="10" y1="34" x2="24" y2="36" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="10" y1="38" x2="24" y2="38" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="40" y1="36" x2="54" y2="34" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="40" y1="38" x2="54" y2="38" stroke="#9CA3AF" stroke-width="1.5"/>
  <!-- Rescue star -->
  <polygon points="32,48 33,52 37,52 34,54 35,58 32,56 29,58 30,54 27,52 31,52" fill="#FBBF24"/>
</svg>
