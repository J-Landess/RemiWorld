<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#2C1A0E"/>
  <!-- Dog body -->
  <ellipse cx="32" cy="40" rx="16" ry="14" fill="#D97706"/>
  <!-- Head -->
  <circle cx="32" cy="24" r="14" fill="#B45309"/>
  <!-- Ears hanging down -->
  <ellipse cx="20" cy="26" rx="6" ry="10" fill="#92400E"/>
  <ellipse cx="44" cy="26" rx="6" ry="10" fill="#92400E"/>
  <!-- Eyes -->
  <circle cx="27" cy="22" r="3.5" fill="#1C1917"/>
  <circle cx="37" cy="22" r="3.5" fill="#1C1917"/>
  <circle cx="28" cy="21" r="1.5" fill="white"/>
  <circle cx="38" cy="21" r="1.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="32" cy="29" rx="3.5" ry="2.5" fill="#1C1917"/>
  <!-- Wagging tail -->
  <path d="M46 42 Q56 36 56 28" stroke="#D97706" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Rescue tag -->
  <circle cx="32" cy="54" r="5" fill="#10B981"/>
  <line x1="30" y1="52" x2="34" y2="56" stroke="white" stroke-width="2"/>
  <line x1="34" y1="52" x2="30" y2="56" stroke="white" stroke-width="2"/>
</svg>
