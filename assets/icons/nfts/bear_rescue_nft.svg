  <!-- Eyes -->
  <circle cx="26" cy="30" r="3.5" fill="#1C1917"/>
  <circle cx="38" cy="30" r="3.5" fill="#1C1917"/>
  <circle cx="27" cy="29" r="1.5" fill="white"/>
  <circle cx="39" cy="29" r="1.5" fill="white"/>
